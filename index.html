<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu du Jour</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --accent-color: #d9534f;
            --secondary-color: #6c757d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .menu-container {
            background-color: var(--card-bg);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        header {
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .date {
            font-style: italic;
            color: var(--secondary-color);
            margin: 0;
        }

        .section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--secondary-color);
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .item {
            margin-bottom: 15px;
        }

        .item-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .item-desc {
            font-size: 0.9rem;
            color: var(--secondary-color);
            margin-top: 2px;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 2px solid var(--bg-color);
            font-size: 0.85rem;
            color: var(--secondary-color);
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <header>
            <h1>Menu du Midi</h1>
            <!-- Modifier la date ici -->
            <p class="date">Dimanche 9 Août</p>
        </header>

        <!-- ENTRÉES / APÉRITIFS -->
        <div class="section">
            <h2 class="section-title">Entrées & Apéros</h2>
            
            <div class="item">
                <div class="item-name">Entrée</div>
                <div class="item-desc">Entrée</div>
            </div>
        </div>

        <!-- PLATS -->
        <div class="section">
            <h2 class="section-title">Plats</h2>

            <div class="item">
                <div class="item-name">Bouillabaisse</div>
                <div class="item-desc">Vraie Bouillabaisse au Barnouins</div>
            </div>
        </div>

        <!-- DESSERTS -->
        <div class="section">
            <h2 class="section-title">Desserts/fromages</h2>

            <div class="item">
                <div class="item-name">Dessert/fromages au choix</div>
                <div class="item-desc">Fruits, fromages, glaces et autres (au choix)</div>
            </div>
        </div>

        <footer>
            <p>Origine des produits : Provence.</p>
        </footer>
    </div>

</body>
</html>
